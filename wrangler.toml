# ===================================================
# Cloudflare Worker & KV Configuration (wrangler.toml)
# Domain: cdn.ten.my.id
# ===================================================

name = "cdn-tenmyid"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Cloudflare Workers with Static Assets
[assets]
directory = "./public"
binding = "ASSETS"

# Environment Variables
[vars]
ADMIN_API_KEY = "ten-cdn-secret-key"

# ==============================================================================
# Cloudflare KV Namespace Binding
# Opsi 1 (Direkomendasikan): Hubungkan lewat Dashboard Cloudflare:
#         Settings > Bindings (atau Variables and Secrets) > KV Namespace
#         - Variable name: CDN_KV
#         - Pilih KV Namespace yang sudah Anda buat.
#
# Opsi 2: Buka komentar di bawah ini dan ganti ID dengan ID asli KV Anda (32 karakter hex):
# [[kv_namespaces]]
# binding = "CDN_KV"
# id = "MASUKKAN_KV_ID_ASLI_DISINI"
# ==============================================================================
