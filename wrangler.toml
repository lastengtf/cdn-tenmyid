# ===================================================
# Cloudflare Worker & KV Configuration
# Platform: CDN TEN (cdn.ten.my.id)
# ===================================================

name = "cdn-tenmyid"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Cloudflare Workers with Static Assets
[assets]
directory = "./public"
binding = "ASSETS"

# Environment Variables diatur sepenuhnya di Dashboard Cloudflare (Settings -> Variables and Secrets)
# Untuk pengujian lokal dapat disimpan di file .dev.vars (sudah diabaikan oleh git)

# ==============================================================================
# Cloudflare KV Namespace Binding
# ==============================================================================
[[kv_namespaces]]
binding = "CDN_KV"
id = "dce4b6259909484888bf22eb63dcf826"
