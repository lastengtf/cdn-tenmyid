# ===================================================
# Cloudflare Worker & KV Configuration
# Platform: CDN TEN (cdn.ten.my.id)
# ===================================================

name = "cdn-tenmyid"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Cloudflare Workers with Static Assets
[assets]
directory = "./public"
binding = "ASSETS"

# Environment Variables (Dapat disesuaikan atau dioverride di Dashboard Cloudflare)
[vars]
ADMIN_EMAIL = "admin@ten.my.id"
ADMIN_PASSWORD = "password123"

# ==============================================================================
# Cloudflare KV Namespace Binding
# ==============================================================================
[[kv_namespaces]]
binding = "CDN_KV"
id = "dce4b6259909484888bf22eb63dcf826"
